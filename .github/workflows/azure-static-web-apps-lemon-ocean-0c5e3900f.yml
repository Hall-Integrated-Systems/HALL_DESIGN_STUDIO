name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA to validate; must match the selected branch head
        required: true
        type: string
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # Manual validation never enters either Azure job below.
  validate_only_job:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/print-first-guided-start') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Validate only (no deployment)
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify requested revision
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]] ||
             [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "::error::Requested SHA does not match this run. Dispatch again with the current branch head."
            exit 1
          fi
          printf 'Validating commit %s without deployment\n' "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Test guided start
        run: npm run test:guided-start

      - name: Test Spacer Ring Lab
        run: npm test --prefix experiments/spacer-ring

      - name: Build Spacer Ring Lab
        run: npm run build --prefix experiments/spacer-ring

      - name: Build integrated Studio
        run: npm run build

  build_and_deploy_job:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.ref != 'codex/print-first-guided-start') }}
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Deploy prebuilt app
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_OCEAN_0C5E3900F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.ref != 'codex/print-first-guided-start' }}
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_OCEAN_0C5E3900F }}
          action: "close"
