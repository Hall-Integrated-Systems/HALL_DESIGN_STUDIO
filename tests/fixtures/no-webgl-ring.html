<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local test: ring without WebGL</title>
    <script>
      // Local test fixture only: simulate a browser that cannot create WebGL.
      const originalGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (kind, ...args) {
        if (kind === 'webgl2' || kind === 'webgl' || kind === 'experimental-webgl') return null;
        return originalGetContext.call(this, kind, ...args);
      };
    </script>
  </head>
  <body>
    <div id="root" data-studio-href="/"></div>
    <script type="module" src="/experiments/spacer-ring/src/main.tsx"></script>
  </body>
</html>
